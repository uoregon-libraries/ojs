version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: adi/Dockerfile
    ports:
      - "8448:80"  # Different port for staging
    volumes:
      - ../:/var/www/html
      - ./config.inc.php:/var/www/html/config.inc.php
      - ojs_files:/var/www/html/files
    depends_on: []

volumes:
  ojs_files: 