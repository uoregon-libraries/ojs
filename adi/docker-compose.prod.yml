version: '3.8'

services:
  app:
    container_name: ojs3_prod
    build:
      context: ..
      dockerfile: adi/Dockerfile
    ports:
      - "8449:80"  # Standard HTTP port for production
    volumes:
      - ../:/var/www/html
      - ojs_files:/var/www/html/files
    depends_on: []

volumes:
  ojs_files: 